name: Platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Platform (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: experimental/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: experimental/platform/go.mod
          cache-dependency-path: experimental/platform/go.sum
      - name: Unit tests
        run: go test -race ./internal/observe ./cmd/worktrees
      - name: Build runtime and integration probes
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./cmd/...
          go build -tags successbox_mmap_probe ./cmd/...
          go build ./testdata/sandboxexec ./testdata/memory ./testdata/memory-guest ./testdata/worktrees
      - name: Run lazy worktrees on the native Linux host
        env:
          CGO_ENABLED: "0"
        run: |
          binary_dir="$RUNNER_TEMP/worktrees-bin"
          mkdir -p "$binary_dir/gvisor-bin"
          go build -o "$binary_dir/runsc" ./cmd/runsc
          go build -o "$binary_dir/gvisor-bin/gvisor_sentry" ./cmd/sentry
          go build -o "$binary_dir/worktrees" ./cmd/worktrees
          go build -o "$binary_dir/worktree-probe" ./testdata/worktrees
          sudo "$binary_dir/worktree-probe" "$RUNNER_TEMP/worktree-probe" "$binary_dir/worktrees" "$binary_dir/runsc"
      - name: Run Create and Close worktree lifecycle
        env:
          CGO_ENABLED: "0"
        run: |
          binary_dir="$RUNNER_TEMP/worktrees-bin"
          go -C ../.. build -o "$binary_dir/sbx" ./cmd/sbx
          go -C ../.. build -o "$binary_dir/successbox-gvisor" ./cmd/successbox-gvisor
          printf '#!/bin/sh\nexec "%s/runsc" --ignore-cgroups "$@"\n' "$binary_dir" > "$binary_dir/runsc-test"
          chmod +x "$binary_dir/runsc-test"
          fixture_parent=$(mktemp -d /var/tmp/successbox-worktree-service.XXXXXX)
          chmod 711 "$fixture_parent"
          install -m 755 "$binary_dir/worktrees" "$fixture_parent/worktrees"
          sudo ../../testdata/gvisor-worktrees.sh "$binary_dir/sbx" "$binary_dir/successbox-gvisor" "$binary_dir/runsc-test" "$fixture_parent/worktrees" "$fixture_parent/run"
