name: Desktop App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'api/gateway/v1/gateway.proto'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'api/gateway/v1/gateway.proto'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin
            arch: arm64
            targets: '@electron-forge/maker-zip'
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            targets: '@electron-forge/maker-zip,@electron-forge/maker-deb'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot dpkg zip
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Make application packages
        run: npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --targets=${{ matrix.targets }}
      - name: Upload application packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: successbox-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: desktop/out/make/
          if-no-files-found: error
          compression-level: 0
