name: Apple

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Apple Containerization (arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: swift --version
      - name: Build and sign
        run: make apple
      - name: Check dependency lockfile
        run: git diff --exit-code -- Package.resolved
      - name: Verify signed executable
        run: |
          codesign --verify --strict bin/successbox-apple
          bin/successbox-apple --help
